name: Build

on:
  workflow_dispatch:
  pull_request:
    branches: ["*"]
  push:
    branches: ["*"]
    tags:
      - "v*"

jobs:
  build:
    uses: rahulsom/_/.github/workflows/gradle.yml@main
    permissions:
      security-events: write
      actions: read
      contents: write
      packages: write
      pages: write
    with:
      java-version: 25
      codeql: false
      codeql-actions: true
      codeql-typescript: true
      codeql-javascript: true
    secrets:
      ORG_GRADLE_PROJECT_SONATYPEUSERNAME: ${{ secrets.ORG_GRADLE_PROJECT_SONATYPEUSERNAME }}
      ORG_GRADLE_PROJECT_SONATYPEPASSWORD: ${{ secrets.ORG_GRADLE_PROJECT_SONATYPEPASSWORD }}
      ORG_GRADLE_PROJECT_SIGNINGKEY: ${{ secrets.ORG_GRADLE_PROJECT_SIGNINGKEY }}
      ORG_GRADLE_PROJECT_SIGNINGPASSWORD: ${{ secrets.ORG_GRADLE_PROJECT_SIGNINGPASSWORD }}

  test-site:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Test manual publishing helpers
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
          cache: "npm"
          cache-dependency-path: "grooves-site/package-lock.json"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('grooves-site/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Regression test Site
        run: |-
          cd grooves-site
          ./npmw ci
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
            npx playwright install --with-deps
          fi
          ./npmw run build
          ./npmw run test
          npx playwright test visual.spec.ts

  publish-site:
    runs-on: ubuntu-latest
    needs: [build, test-site]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    concurrency:
      group: publish-site
      cancel-in-progress: false
    permissions:
      contents: write
      pages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Checkout published site
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: build/site-pages

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: "temurin"

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
          cache: "npm"
          cache-dependency-path: "grooves-site/package-lock.json"

      - name: Install site dependencies
        working-directory: grooves-site
        run: ./npmw ci

      - name: Backfill manuals and prepare site
        run: python3 scripts/prepare-site.py build/site-pages

      - name: Publish Site
        working-directory: build/site-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if ! git diff --cached --quiet; then
            git commit -m "Publish site and tagged manuals"
            git push origin HEAD:gh-pages
          fi

      # GITHUB_TOKEN pushes do not trigger a Pages build on their own.
      - name: Build GitHub Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
