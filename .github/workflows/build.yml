name: Build

on:
  workflow_dispatch:
  pull_request:
    branches: ["*"]
  push:
    branches: ["*"]
    tags:
      - "v*"

jobs:
  build-subproject:
    name: Build ${{ matrix.project }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Keep this list in sync with the subprojects in settings.gradle.kts.
        project:
          - grooves-api
          - grooves-core
          - grooves-diagrams
          - grooves-docs
          - grooves-example-javaee
          - grooves-example-pushstyle
          - grooves-example-springboot-jpa
          - grooves-example-springboot-kotlin
          - grooves-example-test
          - grooves-groovy
          - grooves-java
          - grooves-site
          - grooves-types
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: zulu

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Build subproject
        env:
          SUBPROJECT: ${{ matrix.project }}
        run: |
          args=()
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            args+=(-Prelease.useLastTag=true)
          fi
          ./gradlew ":$SUBPROJECT:build" --no-daemon "${args[@]}"

      # A fresh runner cannot see cache entries produced by other jobs in this run.
      - name: Upload Gradle task cache
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: gradle-task-cache-${{ matrix.project }}
          path: ~/.gradle/caches/build-cache-1/[0-9a-f]*
          include-hidden-files: true
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 1
          overwrite: true

  build:
    name: build / Build with Gradle
    needs: build-subproject
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: zulu

      - uses: gradle/actions/setup-gradle@v6

      - name: Download subproject task caches
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: gradle-task-cache-*
          path: ${{ runner.temp }}/gradle-task-caches

      - name: Restore Gradle task cache entries
        run: |
          cache_dir="$HOME/.gradle/caches/build-cache-1"
          mkdir -p "$cache_dir" "$RUNNER_TEMP/gradle-task-caches"
          find "$RUNNER_TEMP/gradle-task-caches" -regextype posix-extended \
            -type f -regex '.*/[[:xdigit:]]{32}' \
            -exec cp --update=none --target-directory="$cache_dir" {} +

      - name: Build branch or release candidate
        if: github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' && (!startsWith(github.ref, 'refs/tags/v') || contains(github.ref, '-rc'))
        run: |
          args=()
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            args+=(-Prelease.useLastTag=true)
          fi
          ./gradlew build --no-daemon "${args[@]}"

      - name: Build and publish
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-rc'))
        env:
          ORG_GRADLE_PROJECT_sonatypeUsername: ${{ secrets.ORG_GRADLE_PROJECT_SONATYPEUSERNAME }}
          ORG_GRADLE_PROJECT_sonatypePassword: ${{ secrets.ORG_GRADLE_PROJECT_SONATYPEPASSWORD }}
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.ORG_GRADLE_PROJECT_SIGNINGKEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.ORG_GRADLE_PROJECT_SIGNINGPASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            ./gradlew -Prelease.useLastTag=true build final --no-daemon
          else
            ./gradlew build snapshot --no-daemon
          fi

  analyze:
    name: build / Analyze ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            name: GitHub Actions
          - language: javascript
            name: JavaScript
          - language: typescript
            name: TypeScript
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  test-site:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Test manual publishing helpers
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
          cache: "npm"
          cache-dependency-path: "grooves-site/package-lock.json"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('grooves-site/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Regression test Site
        run: |-
          cd grooves-site
          ./npmw ci
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
            npx playwright install --with-deps
          fi
          ./npmw run build
          ./npmw run test
          npx playwright test visual.spec.ts

  publish-site:
    runs-on: ubuntu-latest
    needs: [build, analyze, test-site]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    concurrency:
      group: publish-site
      cancel-in-progress: false
    permissions:
      contents: write
      pages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Checkout published site
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: build/site-pages

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: "temurin"

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
          cache: "npm"
          cache-dependency-path: "grooves-site/package-lock.json"

      - name: Install site dependencies
        working-directory: grooves-site
        run: ./npmw ci

      - name: Backfill manuals and prepare site
        run: python3 scripts/prepare-site.py build/site-pages

      - name: Publish Site
        working-directory: build/site-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if ! git diff --cached --quiet; then
            git commit -m "Publish site and tagged manuals"
            git push origin HEAD:gh-pages
          fi

      # GITHUB_TOKEN pushes do not trigger a Pages build on their own.
      - name: Build GitHub Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
